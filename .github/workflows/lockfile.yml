name: Generar package-lock.json

# Se ejecuta a mano desde la pestaña Actions ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit del lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: agregar package-lock.json para instalaciones reproducibles"
          git push
