version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      testing:
        patterns: ["vitest", "@playwright/test"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
