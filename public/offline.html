<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Mundo Explorer</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e5edf7;

      .card { max-width: 420px; }
      h1 { font-size: 28px; margin: 16px 0 8px; }
      p { color: #94a3b8; line-height: 1.5; }
      a { display: inline-block; margin-top: 20px; background: #0b6fe0; color: #fff; padding: 10px 18px;
        border-radius: 12px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Sin conexión · You're offline</h1>
      <p>No hay internet. Puedes seguir viendo los países que ya visitaste.<br />

      <a href="/">Reintentar · Retry</a>
    </div>
  </body>
